name: Roster data
description: A roster, role, placement, photo or logo is wrong or missing.
labels: ["data", "triage"]
body:
  - type: input
    id: roster
    attributes:
      label: Team and Major
      placeholder: "Fnatic, ESL One Cologne 2015"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong?
      options: [Wrong or missing player, Wrong role (IGL / AWP / entry / lurk / support), Wrong placement or date, Wrong or missing photo, Wrong or missing logo, Missing roster]
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it be?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A Major's Wikipedia "Final standings" table, a Liquipedia page, or a freely licensed image page.
    validations:
      required: true
