name: CI

# Routine checks stay short: unit tests, typecheck/build and a desktop/phone browser smoke test.
# Main deploys the exact build that passed them. Full playthroughs and balance simulations
# run weekly or manually in extended-checks.yml. Run CI manually on main to redeploy.
# Branches are tested through their pull request only (push runs on main), and a newer push cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Browser smoke test (desktop and phone)
        # GitHub's Ubuntu image includes Chrome; smoke checks need no browser download or apt install.
        run: |
          chrome_path="$(command -v google-chrome)"
          CHROMIUM_PATH="$chrome_path" npm run e2e:smoke
          CHROMIUM_PATH="$chrome_path" npm run e2e:legend
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: shots/
          if-no-files-found: ignore
      - name: Package the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
