name: Release

# Run from the Actions tab with a version (e.g. v1.1.0). Tests and builds main, then publishes a GitHub Release
# with the single-file game attached and the matching CHANGELOG.md section as notes.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, e.g. v1.1.0 (needs a "## [1.1.0]" section in CHANGELOG.md)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Release notes from CHANGELOG.md
        run: |
          v="${VERSION#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No '## [$v]' section in CHANGELOG.md"; exit 1; }
          # Keep the changelog's link references (e.g. [#2]: https://…) so links in the notes work.
          { echo; grep -E '^\[#[0-9]+\]:' CHANGELOG.md; } >> notes.md
      - name: Publish
        run: |
          cp dist/index.html "major-mayhem-$VERSION.html"
          gh release create "$VERSION" "major-mayhem-$VERSION.html" --target "$GITHUB_SHA" --title "Major Mayhem $VERSION" --notes-file notes.md
